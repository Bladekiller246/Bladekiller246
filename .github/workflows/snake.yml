# Redraws the contribution snake (neon cyan dots, magenta snake) onto the `output`
# branch, which README.md reads from. Actions are pinned to commit SHAs.
name: snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff2a6d&color_dots=#10101c,#0b5060,#078599,#04b6cd,#00e5ff
            dist/snake-light.svg?palette=github-light&color_snake=#e0115f&color_dots=#ebedf0,#a4cdd3,#6ab3bb,#349aa4,#00838f

      - uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
