# Redraws the contribution snake (amber phosphor dots and snake) onto the `output`
# branch, which README.md reads from. Actions are pinned to commit SHAs.
name: snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffd88a&color_dots=#161b22,#4a3208,#7a5300,#b37a00,#ffb000
            dist/snake-light.svg?palette=github-light&color_snake=#b35c00&color_dots=#ebedf0,#f5d9a8,#ebb866,#d9952b,#b36b00

      - uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
