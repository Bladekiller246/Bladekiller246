# Redraws the contribution snake (Catppuccin Mocha / Latte) onto the `output`
# branch, which README.md reads from. Actions are pinned to commit SHAs.
name: snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#94e2d5&color_dots=#1e1e2e,#52476a,#7d699d,#a588cb,#cba6f7
            dist/snake-light.svg?palette=github-light&color_snake=#179299&color_dots=#e6e9ef,#cab4ef,#b288ef,#9d60ef,#8839ef

      - uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
